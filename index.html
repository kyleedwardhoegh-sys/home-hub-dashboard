<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Home Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14213d">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="ambient" class="view active">
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="ambient-content" id="ambient-content">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">&nbsp;</div>
    <div class="weather" id="weather" hidden>
      <span class="weather-icon" id="weather-icon">⛅</span>
      <span class="weather-temp" id="weather-temp">--°</span>
      <span class="weather-desc" id="weather-desc">Loading weather…</span>
    </div>
    <div class="calendar-events" id="calendar-events" hidden></div>
  </div>

  <div class="avatar-row" id="avatar-row">
    <button class="avatar-chip" data-person="kyle" type="button">KY</button>
    <button class="avatar-chip" data-person="logan" type="button">LO</button>
    <button class="avatar-chip" data-person="nash" type="button">NA</button>
    <button class="avatar-chip" data-person="nellie" type="button">NE</button>
  </div>

  <div class="ambient-hint">Tap anywhere to open</div>
</section>

<section id="launcher" class="view" hidden>
  <div class="launcher-header">
    <h1>Home Hub</h1>
  </div>
  <div class="launcher-grid">
    <a class="tile tile-workouts" href="https://home-hub-web-hoegh-home.vercel.app/">
      <span class="tile-emoji">🏋️</span>
      <span class="tile-name">Workouts</span>
    </a>
    <a class="tile tile-football" href="https://football-practice-planner-hoegh-home.vercel.app/">
      <span class="tile-emoji">🏈</span>
      <span class="tile-name">Practice Planner</span>
    </a>
    <a class="tile tile-team" href="https://maple-grove-crimson.vercel.app/">
      <span class="tile-emoji">🏆</span>
      <span class="tile-name">Team Site</span>
    </a>
    <button class="tile tile-calendar" id="tile-calendar" type="button">
      <span class="tile-emoji">📅</span>
      <span class="tile-name">Calendar</span>
    </button>
  </div>
</section>

<section id="calendar-view" class="view" hidden>
  <div class="launcher-header">
    <h1>This Week</h1>
  </div>
  <div class="agenda" id="agenda-content"></div>
</section>

<section id="person" class="view" hidden>
  <div class="person-header" id="person-header">
    <span class="person-badge" id="person-badge">NA</span>
    <h1 id="person-greeting">Hey, Nash</h1>
  </div>
  <div class="person-content" id="person-content"></div>
</section>

<div class="celebration" id="celebration" hidden>
  <div class="celebration-card">
    <div class="celebration-emoji" id="celebration-emoji">🔥</div>
    <div class="celebration-title" id="celebration-title">Nash finished a workout!</div>
    <div class="celebration-sub" id="celebration-sub"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
